<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkTime</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#030d2c;color:white;font-family:Arial,sans-serif}
header{height:60px;background:#061943;padding:15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #233b72}
.logo{font-size:22px;font-weight:bold}.logo span{color:#59c9ff}
button,input,textarea{font:inherit}
button{cursor:pointer;color:white;border:0}
.auth{max-width:420px;margin:60px auto;padding:22px;background:#0c2052;border-radius:18px}
.auth input,.field{width:100%;padding:13px;margin:7px 0;background:#071638;border:1px solid #314a80;border-radius:10px;color:white}
.primary{width:100%;padding:13px;background:#315ff0;border-radius:10px;margin-top:10px}
.link{background:none;color:#85d8ff;width:100%;padding:12px}
#app{display:none}
.layout{display:grid;grid-template-columns:60px 1fr 250px;min-height:calc(100vh - 116px)}
.side{background:#041033;padding:12px 6px;display:flex;flex-direction:column;gap:10px;align-items:center}
.side button{width:44px;height:44px;border-radius:13px;background:#10285c;font-size:21px}
.center{min-width:0;background:#06143b;display:flex;flex-direction:column}
.room{padding:13px;background:#081943;border-bottom:1px solid #233b72;display:flex;justify-content:space-between;align-items:center}
select{background:#132b62;color:white;border:0;padding:9px;border-radius:18px}
.chat{height:calc(100vh - 220px);min-height:300px;overflow:auto;padding:15px;background:radial-gradient(ellipse at bottom,#112451,#06143b)}
.welcome{text-align:center;color:#aebbd8;margin:20px}
.message{display:flex;gap:9px;margin:15px 0;align-items:flex-start}
.avatar{width:40px;height:40px;flex-shrink:0;border-radius:50%;background:#24447e;border:2px solid #36bfe9;display:grid;place-items:center;font-weight:bold}
.name{color:#55d5c5;font-weight:bold;margin-bottom:6px}
.rank{color:#ffd45c;font-size:12px}
.bubble{background:#172f68;padding:11px 14px;border-radius:5px 16px 16px;display:inline-block;overflow-wrap:anywhere;white-space:pre-wrap}
.mine{flex-direction:row-reverse}
.mine .bubble{background:#284ba2;border-radius:16px 5px 16px 16px}
.mine .body{text-align:right}
.composer{display:flex;gap:7px;padding:10px;background:#06163e;border-top:1px solid #233b72}
.composer button{width:40px;border-radius:50%;background:#10285c;font-size:20px}
.composer input{flex:1;min-width:0;border-radius:25px;padding:12px;background:#081638;border:1px solid #263e75;color:white}
.composer .send{background:#315ff0}
.members{background:#07183f;padding:13px;border-left:1px solid #233b72}
.member{display:flex;gap:9px;align-items:center;padding:10px 3px;border-bottom:1px solid #1a2d5c}
.member small{display:block;color:#ffd45c;margin-top:4px}
footer{height:56px;background:#061943;display:flex;justify-content:space-between;align-items:center;padding:10px 18px}
footer button{background:none;font-size:22px}
.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:15px}
.modal.show{display:flex}
.box{width:min(100%,420px);max-height:85vh;overflow:auto;background:#0c2052;padding:20px;border:1px solid #385b9c;border-radius:18px}
.close{float:right;background:#1a326a;border-radius:50%;padding:8px}
.muted{color:#aebbd8;font-size:12px}
@media(max-width:800px){.layout{grid-template-columns:52px 1fr}.members{display:none}.side{padding:10px 4px}.side button{width:42px;height:42px}.chat{height:calc(100dvh - 215px)}}
</style>
</head>
<body>
<header>
<div class="logo">TALK<span>TIME</span></div>
<div>
<button id="messagesBtn">✉</button>
<button id="membersBtn">♙</button>
<button id="notifyBtn">♧</button>
<button id="profileBtn">👤</button>
</div>
</header>

<div id="auth" class="auth">
<h2 id="authTitle">Welcome to TalkTime</h2>
<p class="muted">Login or create your account</p>
<form id="authForm">
<input id="username" placeholder="Username (signup only)" maxlength="20">
<input id="email" type="email" placeholder="Email address" required>
<input id="password" type="password" placeholder="Password" minlength="6" required>
<div id="error" style="color:#ff9aaf;font-size:13px"></div>
<button class="primary" id="submit">Login</button>
</form>
<button class="link" id="switch">Create a new account</button>
</div>

<div id="app">
<div class="layout">
<nav class="side">
<button title="Chat">⌂</button>
<button title="Activity">◔</button>
<button title="News">▤</button>
<button title="Ranks">♛</button>
<button title="Help">?</button>
<button title="Rooms" onclick="document.getElementById('room').focus()">#</button>
</nav>
<main class="center">
<div class="room"><strong id="roomTitle">Main Lobby</strong>
<select id="room">
<option value="main">Main Lobby</option>
<option value="lahore">Lahore</option>
<option value="karachi">Karachi</option>
<option value="islamabad">Islamabad</option>
<option value="multan">Multan</option>
<option value="peshawar">Peshawar</option>
<option value="quetta">Quetta</option>
</select></div>
<div class="chat" id="chat"><div class="welcome">Welcome to TalkTime. Keep the chat friendly.</div></div>
<form class="composer" id="messageForm">
<button type="button" id="plus">＋</button>
<button type="button" id="emoji">☺</button>
<input id="message" maxlength="1000" placeholder="Type here..." autocomplete="off">
<button class="send">➤</button>
</form>
</main>
<aside class="members">
<strong>Members <span id="count" class="muted">0</span></strong>
<div id="memberList"></div>
</aside>
</div>
<footer><button id="music">▶</button><button id="menu">☰</button></footer>
</div>

<div class="modal" id="modal">
<div class="box">
<button class="close" onclick="closeModal()">✕</button>
<h3 id="modalTitle">TalkTime</h3>
<div id="modalBody"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyDNrlP_auYAjDU6C43THl3cOvVqmQR1kYM",
authDomain:"talktime-70e88.firebaseapp.com",
projectId:"talktime-70e88",
storageBucket:"talktime-70e88.firebasestorage.app",
messagingSenderId:"356630061165",
appId:"1:356630061165:web:156f9afef56c58d1881f64",
measurementId:"G-VS2EHB4KM7"
};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
const OWNER_UID="RCRj1YJf0hSeZIPIzLgpJHQYHNR2";
let signup=false,user=null,profile=null,room="main",msgStop=null,userStop=null;
const $=id=>document.getElementById(id);
function safe(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function initials(s){return (s||"TT").slice(0,2).toUpperCase()}
function rank(uid){return uid===OWNER_UID?"👑 Owner":"Member"}
function openModal(title,body){$("modalTitle").textContent=title;$("modalBody").innerHTML=body;$("modal").classList.add("show")}
function closeModal(){$("modal").classList.remove("show")}
$("switch").onclick=()=>{signup=!signup;$("authTitle").textContent=signup?"Create your TalkTime account":"Welcome to TalkTime";$("username").style.display=signup?"block":"none";$("username").required=signup;$("submit").textContent=signup?"Sign up":"Login";$("switch").textContent=signup?"I already have an account":"Create a new account";$("error").textContent=""};
$("username").style.display="none";
$("authForm").onsubmit=async e=>{
e.preventDefault();$("error").textContent="";
try{
if(signup){
let n=$("username").value.trim();
if(n.length<3||n.length>20)throw Error("Username 3 se 20 characters ka hona chahiye.");
let c=await auth.createUserWithEmailAndPassword($("email").value.trim(),$("password").value);
await db.collection("users").doc(c.user.uid).set({username:n,bio:"",createdAt:firebase.firestore.FieldValue.serverTimestamp()});
}else await auth.signInWithEmailAndPassword($("email").value.trim(),$("password").value);
}catch(e){$("error").textContent=e.message}
};
auth.onAuthStateChanged(async u=>{
user=u;
if(!u){$("auth").style.display="block";$("app").style.display="none";if(msgStop)msgStop();if(userStop)userStop();return}
try{
let s=await db.collection("users").doc(u.uid).get();
if(!s.exists)throw Error("Profile nahi mili. Sign out karke dobara signup karein.");
profile=s.data();$("auth").style.display="none";$("app").style.display="block";
$("profileBtn").textContent=initials(profile.username);
listenUsers();listenMessages();
}catch(e){alert(e.message)}
});
function listenUsers(){
if(userStop)userStop();
userStop=db.collection("users").onSnapshot(s=>{
let a=[];s.forEach(d=>a.push({uid:d.id,...d.data()}));
a.sort((x,y)=>x.uid===OWNER_UID?-1:y.uid===OWNER_UID?1:(x.username||"").localeCompare(y.username||""));
$("count").textContent=a.length;
let html=a.map(x=>`<div class="member"><div class="avatar">${safe(initials(x.username))}</div><div><b>${safe(x.username)}</b><small>${safe(rank(x.uid))}</small></div></div>`).join("");
$("memberList").innerHTML=html||"No members";
},e=>console.log(e));
}
function listenMessages(){
if(msgStop)msgStop();
$("roomTitle").textContent=room==="main"?"Main Lobby":room[0].toUpperCase()+room.slice(1);
msgStop=db.collection("rooms").doc(room).collection("messages").orderBy("createdAt","asc").limit(100).onSnapshot(s=>{
let html="";
if(s.empty)html='<div class="welcome">Room ready. Send the first message!</div>';
s.forEach(d=>{
let m=d.data(),mine=m.uid===user.uid;
let t=m.createdAt&&m.createdAt.toDate?m.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
html+=`<div class="message ${mine?"mine":""}"><div class="avatar">${safe(initials(m.username))}</div><div class="body"><div class="name">${safe(m.username)} <span class="rank">${safe(rank(m.uid))}</span> <span class="muted">${safe(t)}</span></div><div class="bubble">${safe(m.text)}</div></div></div>`;
});
$("chat").innerHTML=html;$("chat").scrollTop=$("chat").scrollHeight;
},e=>{$("chat").innerHTML='<div class="welcome">Messages load nahi huay. Firebase rules check karein.</div>';console.log(e)});
}
$("room").onchange=e=>{room=e.target.value;listenMessages()};
$("messageForm").onsubmit=async e=>{
e.preventDefault();let text=$("message").value.trim();if(!text)return;
if(/https?:\/\/|www\./i.test(text)){alert("External links allowed nahi hain.");return}
$("message").value="";
try{await db.collection("rooms").doc(room).collection("messages").add({uid:user.uid,username:profile.username,text,createdAt:firebase.firestore.FieldValue.serverTimestamp()})}
catch(e){$("message").value=text;alert(e.message)}
};
$("emoji").onclick=()=>{$("message").value+=" 😊";$("message").focus()};
$("plus").onclick=()=>openModal("More options","Photo uploads, stickers, YouTube sharing and microphone need extra Firebase setup and are not active yet.");
$("profileBtn").onclick=()=>openModal("My Profile",`<div style="text-align:center"><div class="avatar" style="width:85px;height:85px;margin:auto;font-size:25px">${safe(initials(profile.username))}</div><h2>${safe(profile.username)}</h2><p>${safe(rank(user.uid))}</p></div><label class="muted">About me</label><textarea id="bio" class="field" maxlength="160">${safe(profile.bio||"")}</textarea><button class="primary" onclick="saveBio()">Save bio</button><button class="primary" onclick="auth.signOut()">Log out</button>`);
window.saveBio=async()=>{try{let b=$("bio").value.trim();await db.collection("users").doc(user.uid).update({bio:b});profile.bio=b;alert("Bio saved");closeModal()}catch(e){alert(e.message)}};
$("membersBtn").onclick=()=>openModal("Members",$("memberList").innerHTML||"No members");
$("messagesBtn").onclick=()=>openModal("Messages","Private messages are not enabled yet. Public room chat is active.");
$("notifyBtn").onclick=()=>openModal("Notifications","Live room messages are shown in the chat.");
$("music").onclick=()=>openModal("Music","Web radio is not enabled yet.");
$("menu").onclick=()=>$("profileBtn").click();
</script>
</body>
</html>
