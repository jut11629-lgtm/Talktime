
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkTime - Chat Together</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#07091e;--panel:#101333;--panel2:#171a45;--line:#5820bd;--purple:#a000ff;--pink:#ed35ff;--blue:#167cff;--text:#f5f2ff;--muted:#b8b1e8}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% 0%,#211052 0%,#0b0b25 45%,#050718 100%);color:var(--text);font-family:Arial,Helvetica,sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer;color:white;border:1px solid #722bdb;background:linear-gradient(120deg,#8d00ed,#3d39d7);border-radius:12px;padding:11px 15px;font-weight:bold;box-shadow:0 0 12px #a000ff44}
button:hover{filter:brightness(1.2)}
input,textarea,select{background:#090d2a;color:white;border:1px solid #4c318e;border-radius:10px;padding:12px;width:100%;outline:none}
input:focus,textarea:focus{border-color:#c34cff;box-shadow:0 0 10px #a000ff55}
#auth{width:min(420px,92%);margin:9vh auto;background:#101333;border:1px solid #8538e8;border-radius:22px;padding:25px;box-shadow:0 0 35px #8d00ed55}
#auth h1{color:#d4a0ff;font-size:32px;margin:0}
#auth p{color:var(--muted)}
#auth input{margin:7px 0}
#auth .actions{display:flex;gap:9px;margin-top:10px}
#auth .actions button{flex:1}
#authStatus{font-size:13px;overflow-wrap:anywhere}
#app{display:none;min-height:100vh}
.topbar{height:94px;display:flex;align-items:center;gap:18px;padding:10px 22px;background:#080a22;border-bottom:1px solid #6723bd;box-shadow:0 5px 25px #5b00bb33}
.logo{min-width:255px;font-size:34px;font-weight:900;color:#d9a2ff;text-shadow:0 0 14px #b000ff}
.logo small{display:block;font-size:13px;color:#d8c9ff;font-weight:normal;text-shadow:none;margin-top:3px}
.welcome{flex:1;text-align:center;border:1px solid #8034ec;border-radius:28px;padding:13px;background:#171044;box-shadow:0 0 18px #8300ff66;color:#eee0ff}
.topright{display:flex;align-items:center;gap:12px}
.iconbtn{font-size:20px;padding:12px;background:#17123b}
.userTop{display:flex;align-items:center;gap:10px;background:#111333;border:1px solid #6c2ac6;padding:8px 12px;border-radius:30px;min-width:190px}
.avatar{width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid #b447ff;background:#261a55;display:grid;place-items:center;font-size:23px;flex-shrink:0}
.owner{background:#7900dc;color:white;border-radius:18px;padding:4px 9px;font-size:11px;white-space:nowrap}
.memberRank{background:#0759b8;color:white;border-radius:18px;padding:4px 9px;font-size:11px}
.onlineDot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#00e777;margin-right:6px;box-shadow:0 0 8px #00e777}
.layout{display:grid;grid-template-columns:300px minmax(400px,1fr) 325px;gap:12px;padding:14px;max-width:1700px;margin:auto}
.panel{background:linear-gradient(150deg,#111333f5,#0a0d29f5);border:1px solid #7130cb;border-radius:17px;box-shadow:0 0 17px #7100d733;min-width:0}
.left{padding:12px;align-self:start}
.profileCard{display:flex;align-items:center;gap:12px;padding:12px;background:linear-gradient(120deg,#27105a,#111536);border:1px solid #8d38e7;border-radius:15px;margin-bottom:12px}
.profileCard .avatar{width:76px;height:76px}
.profileName{font-size:17px;font-weight:bold;overflow-wrap:anywhere}
.rankLine{margin-top:8px}
.nav button{width:100%;display:flex;align-items:center;gap:13px;text-align:left;margin:5px 0;background:transparent;border:0;box-shadow:none;border-bottom:1px solid #29204e;border-radius:8px;font-size:16px;padding:13px}
.nav button.active,.nav button:hover{background:linear-gradient(100deg,#9400f4,#174ee6);box-shadow:0 0 17px #9c00ff99}
.nav button span:first-child{font-size:23px;width:30px;text-align:center}
.miniCard{padding:12px;margin-top:12px;border:1px solid #7a28d5;border-radius:14px;background:#111438;text-align:center;color:#d7b6ff}
.center{display:flex;flex-direction:column;min-height:calc(100vh - 122px);overflow:hidden}
.chatHead{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid #46218b}
.chatHead h2{margin:0;font-size:25px}
.chatHead p{margin:5px 0 0;color:var(--muted);font-size:13px}
.onlineCount{border:1px solid #6323bd;border-radius:25px;padding:10px 14px;color:#d9c4ff;white-space:nowrap}
.newsBanner{margin:10px 14px;padding:12px;border:1px solid #7e2bdd;border-radius:11px;background:linear-gradient(100deg,#351078,#151747);font-size:14px}
#messages{flex:1;min-height:340px;max-height:calc(100vh - 360px);overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-start;max-width:100%}
.msg .avatar{width:52px;height:52px}
.bubble{min-width:0;max-width:calc(100% - 60px);padding:11px 14px;background:linear-gradient(120deg,#171a48,#20114c);border:1px solid #4e258f;border-radius:16px;overflow-wrap:anywhere;box-shadow:0 0 9px #6200bd22}
.msgTop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:7px}
.msgName{font-weight:bold;color:#e5b8ff}
.msgTime{font-size:11px;color:#aaa0d5;margin-left:auto}
.msgText{line-height:1.45;white-space:pre-wrap}
.watermark{position:absolute;right:7%;top:38%;font-size:clamp(38px,7vw,86px);font-style:italic;font-weight:bold;color:#7b00c9;opacity:.12;pointer-events:none;transform:rotate(-9deg)}
.chatBody{position:relative;display:flex;flex:1;min-height:0}
.composer{display:flex;gap:8px;align-items:center;padding:12px;border-top:1px solid #4d218b;background:#0c0e2a}
.composer input{flex:1;border-radius:25px;padding:15px}
.composer button{padding:13px 18px}
.toolbtn{font-size:20px;background:#201247;padding:10px}
.right{padding:12px;align-self:start}
.sideTitle{font-size:18px;font-weight:bold;padding:8px 3px 13px;border-bottom:1px solid #42206e;margin-bottom:7px}
.memberRow{display:flex;align-items:center;gap:9px;padding:9px 2px;border-bottom:1px solid #29204c;min-width:0}
.memberRow .avatar{width:38px;height:38px;font-size:18px}
.memberName{font-size:13px;overflow-wrap:anywhere;
