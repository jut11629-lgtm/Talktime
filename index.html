
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TalkTime</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5f9;color:#182230}
header{background:#2457d6;color:white;padding:16px;text-align:center;font-size:24px;font-weight:bold}
main{max-width:760px;margin:18px auto;padding:14px}
.card{background:white;border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 12px #0000000d}
input,button,select{width:100%;padding:12px;margin:6px 0;border:1px solid #ccd3df;border-radius:9px;font-size:16px}
button{background:#2457d6;color:white;border:0;font-weight:bold}
button.secondary{background:#e8edfb;color:#1b3f9d}
#app{display:none}
#ownerPanel{display:none}
.muted{color:#657187;font-size:13px}
.row{display:flex;gap:8px}
.row button{width:auto;flex:1}
#messages{height:280px;overflow:auto;border:1px solid #e1e5ed;border-radius:10px;padding:10px}
.msg{padding:8px;margin:6px 0;background:#f1f4fa;border-radius:8px;overflow-wrap:anywhere}
small{color:#657187}
h2{margin-top:0;font-size:19px}
.member-controls{border-top:1px solid #ddd;margin-top:8px;padding-top:8px}
</style>
</head>
<body>
<header>💬 TalkTime</header>
<main>

<section id="auth" class="card">
<h2>Welcome to TalkTime</h2>
<p class="muted">Login or create your account to start chatting.</p>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<div class="row">
<button id="signup">Create account</button>
<button id="login" class="secondary">Login</button>
</div>
<p id="authStatus" class="muted"></p>
</section>

<section id="app">

<div class="card">
<div class="row">
<div style="flex:1">
<b id="myName">Member</b>
<div class="muted" id="myRank">Rank: Member</div>
</div>
<button id="logout" class="secondary">Logout</button>
</div>
</div>

<div id="ownerPanel" class="card">
<h2>👑 Owner Panel</h2>
<p class="muted">Manage member ranks from here.</p>
<div id="ownerMembers">Loading members...</div>
<p id="ownerStatus" class="muted"></p>
</div>

<div class="card">
<h2>Public Chat</h2>
<div id="messages"></div>
<input id="messageText" maxlength="1000" placeholder="Write a message...">
<button id="send">Send message</button>
<p id="chatStatus" class="muted"></p>
</div>

<div class="card">
<h2>Members</h2>
<div id="members" class="muted">Loading members...</div>
</div>

<div class="card">
<h2>Private message</h2>
<input id="memberUid" placeholder="Enter member UID">
<input id="privateText" maxlength="1000" placeholder="Write a private message...">
<button id="privateSend">Send private message</button>
<p id="privateStatus" class="muted">Ask the other member for their UID.</p>
<div id="privateMessages"></div>
</div>

</section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

import {
getFirestore,
collection,
doc,
setDoc,
getDoc,
addDoc,
updateDoc,
query,
orderBy,
limit,
onSnapshot,
serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDNrlP_auYAjDU6C43THl3cOvVqmQR1kYM",
authDomain: "talktime-70e88.firebaseapp.com",
projectId: "talktime-70e88",
messagingSenderId: "356630061165",
appId: "1:356630061165:web:156f9afef56c58d1881f64"
};

const OWNER_UID = "RCRj1YJf0hSeZIPIzLgpJHQYHNR2";

const $ = id => document.getElementById(id);
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let myProfile = null;
let stopMessages = null;
let stopMembers = null;
let stopPrivate = null;

function status(id,message){
$(id).textContent = message;
}

function safeText(value){
return String(value ?? "").replace(/[&<>"']/g,c=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[c]));
}

function isOwner(){
return currentUser && currentUser.uid === OWNER_UID;
}

$("signup").onclick = async()=>{
try{
status("authStatus","Creating account...");
await createUserWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);
status("authStatus","Account created.");
}catch(e){
status("authStatus",e.message);
}
};

$("login").onclick = async()=>{
try{
status("authStatus","Logging in...");
await signInWithEmailAndPassword(
auth,
$("email").value.trim(),
$("password").value
);
}catch(e){
status("authStatus",e.message);
}
};

$("logout").onclick = ()=>signOut(auth);

$("send").onclick = async()=>{
const text = $("messageText").value.trim();
if(!text)return;

try{
await addDoc(collection(db,"messages"),{
uid:currentUser.uid,
name:myProfile.name,
rank:myProfile.rank,
text,
createdAt:serverTimestamp()
});

$("messageText").value="";
status("chatStatus","");
}catch(e){
status("chatStatus",e.message);
}
};

$("privateSend").onclick = async()=>{
const otherUid = $("memberUid").value.trim();
const text = $("privateText").value.trim();

if(!otherUid || !text){
return status("privateStatus","Enter member UID and message.");
}

if(otherUid === currentUser.uid){
return status("privateStatus","You cannot message yourself.");
}

const roomId = [currentUser.uid,otherUid].sort().join("_");

try{
await addDoc(
collection(db,"privateRooms",roomId,"messages"),
{
uid:currentUser.uid,
name:myProfile.name,
text,
createdAt:serverTimestamp()
}
);

$("privateText").value="";
status("privateStatus","Private message sent.");
watchPrivate(roomId);

}catch(e){
status("privateStatus",e.message);
}
};

function watchPrivate(roomId){
if(stopPrivate)stopPrivate();

const q = query(
collection(db,"privateRooms",roomId,"messages"),
orderBy("createdAt"),
limit(100)
);

stopPrivate = onSnapshot(q,snap=>{
$("privateMessages").innerHTML = snap.docs.map(d=>{
const m=d.data();
return `<div class="msg">
<b>${safeText(m.name||"Member")}</b><br>
${safeText(m.text)}
</div>`;
}).join("");
},e=>status("privateStatus",e.message));
}

// Owner rank management
$("ownerMembers").onclick = async(event)=>{
const button = event.target.closest("button[data-uid]");
if(!button)return;

if(!isOwner()){
status("ownerStatus","Owner permission required.");
return;
}

const uid = button.dataset.uid;
const select = document.getElementById("rank-"+uid);

if(!select)return;

const newRank = select.value;
const allowedRanks = ["Member","Moderator","Admin"];

if(!allowedRanks.includes(newRank)){
status("ownerStatus","Invalid rank.");
return;
}

if(uid === OWNER_UID){
status("ownerStatus","Owner rank cannot be changed here.");
return;
}

try{
button.disabled = true;
status("ownerStatus","Updating rank...");

await updateDoc(doc(db,"users",uid),{
rank:newRank
});

status("ownerStatus","Rank updated successfully.");
}catch(e){
status("ownerStatus",e.message);
}finally{
button.disabled = false;
}
};

function startMembers(){
if(stopMembers)stopMembers();

stopMembers = onSnapshot(
query(collection(db,"users"),limit(100)),
snap=>{

const docs = snap.docs;

$("members").innerHTML = docs.map(d=>{
const m=d.data();
return `<div class="msg">
<b>${safeText(m.name||"Member")}</b>
— ${safeText(m.rank||"Member")}
<br><small>UID: ${safeText(m.uid||d.id)}</small>
</div>`;
}).join("");

if(!isOwner())return;

$("ownerMembers").innerHTML = docs.map(d=>{
const m=d.data();
const uid=d.id;
const rank=m.rank||"Member";

if(uid === OWNER_UID){
return `<div class="msg">
<b>${safeText(m.name||"Owner")}</b>
— Owner 👑
</div>`;
}

return `<div class="msg">
<b>${safeText(m.name||"Member")}</b>
<br><small>UID: ${safeText(uid)}</small>
<div class="member-controls">
<select id="rank-${safeText(uid)}">
<option value="Member" ${rank==="Member"?"selected":""}>Member</option>
<option value="Moderator" ${rank==="Moderator"?"selected":""}>Moderator</option>
<option value="Admin" ${rank==="Admin"?"selected":""}>Admin</option>
</select>
<button data-uid="${safeText(uid)}">Update Rank</button>
</div>
</div>`;
}).join("");

},
e=>{
$("members").textContent=e.message;
status("ownerStatus",e.message);
}
);
}

function startMessages(){
if(stopMessages)stopMessages();

const q=query(
collection(db,"messages"),
orderBy("createdAt"),
limit(100)
);

stopMessages=onSnapshot(q,snap=>{
$("messages").innerHTML=snap.docs.map(d=>{
const m=d.data();
return `<div class="msg">
<b>${safeText(m.name||"Member")}</b>
<small>(${safeText(m.rank||"Member")})</small><br>
${safeText(m.text)}
</div>`;
}).join("");

$("messages").scrollTop=$("messages").scrollHeight;

},e=>status("chatStatus",e.message));
}

onAuthStateChanged(auth,async user=>{
currentUser=user;

if(!user){
$("auth").style.display="block";
$("app").style.display="none";
$("ownerPanel").style.display="none";

if(stopMessages)stopMessages();
if(stopMembers)stopMembers();
if(stopPrivate)stopPrivate();

stopMessages=null;
stopMembers=null;
stopPrivate=null;
myProfile=null;
return;
}

try{
const profileRef=doc(db,"users",user.uid);
const profileSnap=await getDoc(profileRef);

if(!profileSnap.exists()){
const name=user.email.split("@")[0];

await setDoc(profileRef,{
uid:user.uid,
name,
email:user.email,
rank:"Member",
createdAt:serverTimestamp()
});

myProfile={name,rank:"Member"};
}else{
myProfile=profileSnap.data();
}

$("myName").textContent=myProfile.name||"Member";

$("myRank").textContent=isOwner()
?"Rank: Owner 👑"
:"Rank: "+(myProfile.rank||"Member");

$("ownerPanel").style.display=isOwner()?"block":"none";

$("auth").style.display="none";
$("app").style.display="block";

startMessages();
startMembers();

}catch(e){
status("authStatus",e.message);
}
});
</script>
</body>
</html>
