
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkTime Pakistan</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#eaf0f4;color:#263238}
header{background:#075e54;color:white;padding:15px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0}
button{border:0;padding:10px 13px;border-radius:7px;background:#087e70;color:white;font-weight:bold;cursor:pointer}
input,textarea{width:100%;padding:12px;border:1px solid #ccd5df;border-radius:7px;margin:6px 0;font-size:15px}
#auth{max-width:400px;margin:40px auto;background:white;padding:22px;border-radius:12px}
#app{display:none;max-width:1200px;margin:15px auto;padding:0 10px}
.topnav{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.layout{display:grid;grid-template-columns:210px 1fr 200px;gap:12px}
.panel{background:white;border-radius:10px;padding:13px;box-shadow:0 2px 8px #0001}
.room{display:block;width:100%;text-align:left;margin:5px 0;background:#edf5f3;color:#075e54}
.room.active{background:#087e70;color:white}
#messages{height:55vh;min-height:300px;overflow-y:auto;background:#f7f9fb;padding:10px;border-radius:8px}
.msg{background:white;border:1px solid #e4e9ed;padding:10px;border-radius:9px;margin:8px 0;overflow-wrap:anywhere}
.msg b{color:#087e70}
.msg small{float:right;color:#89949e}
.send{display:flex;gap:7px;margin-top:8px}
.send input{margin:0}
.member{padding:9px;border-bottom:1px solid #eee}
.muted{font-size:12px;color:#7d8994}
#members{max-height:55vh;overflow:auto}
.hidden{display:none}
@media(max-width:750px){.layout{grid-template-columns:1fr}#messages{height:48vh}#members{max-height:180px}}
</style>
</head>
<body>
<header>
<h2>🇵🇰 TalkTime</h2>
<button id="logout" class="hidden" onclick="auth.signOut()">Logout</button>
</header>

<div id="auth">
<h2>Welcome to TalkTime</h2>
<p class="muted">Join the Pakistani chat community</p>
<input id="username" placeholder="Username (for signup)" maxlength="20">
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button style="width:100%" onclick="signup()">Create Account</button>
<button style="width:100%;margin-top:8px;background:#2457d6" onclick="login()">Login</button>
<p id="status" class="muted"></p>
</div>

<div id="app">
<div class="topnav">
<button onclick="openRoom('main')">Main Chat</button>
<button onclick="openRoom('lahore')">Lahore</button>
<button onclick="openRoom('karachi')">Karachi</button>
<button onclick="openRoom('islamabad')">Islamabad</button>
<button onclick="openRoom('multan')">Multan</button>
<button onclick="openRoom('peshawar')">Peshawar</button>
<button onclick="openRoom('quetta')">Quetta</button>
</div>

<div class="layout">
<aside class="panel">
<h3>🌍 Chat Rooms</h3>
<div id="roomButtons"></div>
<hr>
<h3>👤 My Profile</h3>
<div id="myName"></div>
<textarea id="bio" rows="3" maxlength="160" placeholder="Write your bio"></textarea>
<button onclick="saveBio()">Save Profile</button>
</aside>

<main class="panel">
<h3 id="roomTitle">🌐 Main Chat</h3>
<div id="messages">Loading chat...</div>
<div style="margin-top:9px">
<button onclick="emoji('😊')">😊</button>
<button onclick="emoji('❤️')">❤️</button>
<button onclick="emoji('😂')">😂</button>
<button onclick="emoji('😍')">😍</button>
<button onclick="emoji('🔥')">🔥</button>
<button onclick="emoji('👍')">👍</button>
</div>
<div class="send">
<input id="message" maxlength="1000" placeholder="Write your message..." onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Send</button>
</div>
<p class="muted">Be respectful. Never share your password or private information.</p>
</main>

<aside class="panel">
<h3>👥 Members</h3>
<div id="members">Loading...</div>
</aside>
</div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyDNrlP_auYAjDU6C43THl3cOvVqmQR1kYM",
authDomain:"talktime-70e88.firebaseapp.com",
projectId:"talktime-70e88",
storageBucket:"talktime-70e88.firebasestorage.app",
messagingSenderId:"356630061165",
appId:"1:356630061165:web:156f9afef56c58d1881f64",
measurementId:"G-VS2EHB4KM7"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

let me=null,username="",room="main",stopMessages=null,stopMembers=null;

const rooms={
main:"🌐 Main Lobby",
lahore:"📍 Lahore",
karachi:"📍 Karachi",
islamabad:"📍 Islamabad",
multan:"📍 Multan",
peshawar:"📍 Peshawar",
quetta:"📍 Quetta"
};

document.getElementById("roomButtons").innerHTML=
Object.entries(rooms).map(([id,name])=>
`<button class="room" id="btn-${id}" onclick="openRoom('${id}')">${name}</button>`
).join("");

function status(t){document.getElementById("status").textContent=t}

async function signup(){
const n=document.getElementById("username").value.trim();
const e=document.getElementById("email").value.trim();
const p=document.getElementById("password").value;
if(n.length<3||n.length>20)return status("Username 3-20 characters ka hona chahiye.");
if(!e||p.length<6)return status("Valid email aur 6 character password likhein.");
try{
const result=await auth.createUserWithEmailAndPassword(e,p);
await db.collection("users").doc(result.user.uid).set({
username:n,bio:"",createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
}catch(err){status(err.message)}
}

async function login(){
try{
await auth.signInWithEmailAndPassword(
document.getElementById("email").value.trim(),
document.getElementById("password").value
);
}catch(err){status(err.message)}
}

auth.onAuthStateChanged(async user=>{
if(stopMessages)stopMessages();
if(stopMembers)stopMembers();
if(!user){
me=null;
document.getElementById("auth").style.display="block";
document.getElementById("app").style.display="none";
document.getElementById("logout").classList.add("hidden");
return;
}
me=user;
try{
const snap=await db.collection("users").doc(user.uid).get();
if(!snap.exists){alert("Profile not found.");await auth.signOut();return}
username=snap.data().username;
document.getElementById("myName").textContent=username;
document.getElementById("bio").value=snap.data().bio||"";
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("logout").classList.remove("hidden");
openRoom("main");
loadMembers();
}catch(err){alert("Profile error: "+err.message)}
});

function openRoom(r){
room=r;
document.getElementById("roomTitle").textContent=rooms[r];
Object.keys(rooms).forEach(x=>{
document.getElementById("btn-"+x).classList.toggle("active",x===r);
});
if(stopMessages)stopMessages();
const box=document.getElementById("messages");
box.textContent="Loading...";
stopMessages=db.collection("rooms").doc(r).collection("messages")
.orderBy("createdAt","asc").limit(100)
.onSnapshot(s=>{
box.innerHTML="";
s.forEach(d=>{
const v=d.data();
const item=document.createElement("div");
item.className="msg";
const name=document.createElement("b");
name.textContent=v.username||"Member";
const time=document.createElement("small");
time.textContent=v.createdAt?.toDate?v.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
const content=document.createElement("div");
content.textContent=v.text||"";
item.append(name,time,content);
box.appendChild(item);
});
box.scrollTop=box.scrollHeight;
},e=>box.textContent="Chat error: "+e.message);
}

async function sendMessage(){
const input=document.getElementById("message");
const t=input.value.trim();
if(!t||!me)return;
if(/https?:\/\/|www\./i.test(t)){
alert("Links are not allowed in public chat.");
return;
}
input.value="";
try{
await db.collection("rooms").doc(room).collection("messages").add({
uid:me.uid,username:username,text:t,
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
}catch(e){input.value=t;alert("Send error: "+e.message)}
}

function emoji(e){
const input=document.getElementById("message");
input.value+=e;input.focus();
}

async function saveBio(){
try{
await db.collection("users").doc(me.uid).update({
bio:document.getElementById("bio").value.trim()
});
alert("Profile saved!");
}catch(e){alert(e.message)}
}

function loadMembers(){
if(stopMembers)stopMembers();
stopMembers=db.collection("users").orderBy("createdAt","asc").limit(100)
.onSnapshot(s=>{
const box=document.getElementById("members");
box.innerHTML="";
s.forEach(d=>{
const v=d.data();
const div=document.createElement("div");
div.className="member";
const name=document.createElement("b");
name.textContent="👤 "+(v.username||"Member");
const bio=document.createElement("div");
bio.className="muted";
bio.textContent=v.bio||"TalkTime member";
div.append(name,bio);
box.appendChild(div);
});
},e=>document.getElementById("members").textContent=e.message);
}
</script>
</body>
</html>
