
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkTime 💜</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#100923;color:white;font-family:Arial,sans-serif}
header{padding:17px;background:linear-gradient(100deg,#4b168c,#a21caf);font-size:23px;font-weight:bold;text-align:center;box-shadow:0 0 25px #a855f7}
#login{max-width:400px;margin:60px auto;padding:25px;background:#211039;border:1px solid #a855f7;border-radius:18px}
input,button{padding:12px;border-radius:10px;border:1px solid #8546bd;background:#190d2c;color:white;width:100%;margin:6px 0}
button{background:linear-gradient(90deg,#7c3aed,#c026d3);cursor:pointer;font-weight:bold}
#app{display:none}
.layout{display:grid;grid-template-columns:180px 1fr 230px;gap:12px;padding:12px;height:calc(100vh - 65px)}
.panel{background:#211039;border:1px solid #7736a8;border-radius:15px;padding:13px;box-shadow:0 0 13px #7028a455;overflow:auto}
.menu button{margin:7px 0}
.chat{display:flex;flex-direction:column;min-height:0}
#messages{flex:1;overflow:auto;padding:10px}
.msg{background:#32194c;border:1px solid #733c9c;padding:11px;border-radius:12px;margin:9px 0;overflow-wrap:anywhere}
.msg strong{color:#e9a7ff}
#members{overflow:auto}
.member{padding:10px;margin:6px 0;background:#32194c;border-radius:10px;font-size:13px}
.online{color:#4ade80}.offline{color:#999}
#composer{display:flex;gap:5px}
#composer input{flex:1;min-width:0}
#composer button{width:75px}
.stat{background:#32194c;padding:12px;border-radius:12px;margin:8px 0}
.small{font-size:12px;color:#c9a9df}
@media(max-width:750px){
.layout{grid-template-columns:75px 1fr;height:calc(100vh - 65px)}
#membersPanel{grid-column:1/3;max-height:180px}
.menu button{font-size:10px;padding:8px 3px}
}
</style>
</head>
<body>
<header>💜 TALK TIME 💜</header>

<section id="login">
<h2>Welcome to TalkTime</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<input id="username" placeholder="Username (signup only)">
<button onclick="signup()">Create Account</button>
<button onclick="login()">Login</button>
<p id="error" class="small"></p>
</section>

<section id="app">
<div class="layout">
<aside class="panel menu">
<h3>☰ MENU</h3>
<button onclick="showPage('leaderboard')">🏆 Leaderboard</button>
<button onclick="showPage('news')">📢 News</button>
<button onclick="showPage('wall')">👥 Friend Wall</button>
<button onclick="showPage('chat')">💬 Main Chat</button>
<button onclick="logout()">Logout</button>
</aside>

<main class="panel chat">
<div id="profile"></div>
<div id="pageTitle"><h3>💬 Main Chat</h3></div>
<div id="messages"></div>
<div id="composer">
<input id="message" placeholder="Write your message...">
<button onclick="sendMessage()">Send</button>
</div>
</main>

<aside class="panel" id="membersPanel">
<h3>👥 MEMBERS</h3>
<h4 class="online">🟢 ONLINE</h4>
<div id="online"></div>
<h4 class="offline">⚫ OFFLINE</h4>
<div id="offline"></div>
</aside>
</div>
</section>

<script>
const firebaseConfig = {
  apiKey: "PASTE_YOUR_API_KEY",
  authDomain: "talktime-70e88.firebaseapp.com",
  projectId: "talktime-70e88",
  storageBucket: "talktime-70e88.firebasestorage.app",
  messagingSenderId: "PASTE_YOUR_MESSAGING_SENDER_ID",
  appId: "PASTE_YOUR_APP_ID"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

const OWNER="RCRj1YJf0hSeZIPIzLgpJHQYHNR2";
let me=null;
let userData=null;
let stopMessages=null;
let stopUsers=null;
let stopPage=null;

function errorMsg(e){
 document.getElementById("error").innerText=e.message;
}

async function signup(){
 try{
  const name=document.getElementById("username").value.trim();
  if(!name) throw Error("Enter username");
  const c=await auth.createUserWithEmailAndPassword(
   email.value,password.value
  );
  await db.collection("users").doc(c.user.uid).set({
   username:name,rank:"Member",coins:0,ruby:0,level:1,
   lastSeen:firebase.firestore.FieldValue.serverTimestamp()
  });
 }catch(e){errorMsg(e)}
}

async function login(){
 try{
  await auth.signInWithEmailAndPassword(email.value,password.value);
 }catch(e){errorMsg(e)}
}

async function logout(){
 if(me){
  await db.collection("users").doc(me.uid).update({
   lastSeen:firebase.firestore.FieldValue.serverTimestamp()
  }).catch(()=>{});
 }
 await auth.signOut();
}

auth.onAuthStateChanged(async user=>{
 if(!user){
  me=null;
  document.getElementById("login").style.display="block";
  document.getElementById("app").style.display="none";
  if(stopMessages)stopMessages();
  if(stopUsers)stopUsers();
  if(stopPage)stopPage();
  return;
 }
 me=user;
 try{
  const ref=db.collection("users").doc(me.uid);
  let snap=await ref.get();

  if(!snap.exists){
   await ref.set({
    username:me.email.split("@")[0],
    rank:"Member",coins:0,ruby:0,level:1
   });
  }

  if(me.uid===OWNER){
   await ref.set({
    rank:"Owner",
    coins:1000000000,
    ruby:1000000000,
    level:400
   },{merge:true});
  }

  userData=(await ref.get()).data();
  document.getElementById("login").style.display="none";
  document.getElementById("app").style.display="block";
  showProfile();
  listenUsers();
  listenMessages();
 }catch(e){errorMsg(e)}
});

function showProfile(){
 const owner=me.uid===OWNER;
 document.getElementById("profile").innerHTML=`
 <div class="stat">
 <b>${escapeHTML(userData.username||"User")}</b>
 ${owner?"👑 OWNER":escapeHTML(userData.rank||"Member")}
 <p>🪙 Coins: ${Number(userData.coins||0).toLocaleString()}</p>
 <p>💎 Ruby: ${Number(userData.ruby||0).toLocaleString()}</p>
 <p>⭐ Level: ${userData.level||1}</p>
 </div>`;
}

function escapeHTML(s){
 return String(s).replace(/[&<>"']/g,c=>({
 "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[c]);
}

async function sendMessage(){
 const input=document.getElementById("message");
 const text=input.value.trim();
 if(!text||!me)return;
 try{
  await db.collection("rooms").doc("main")
   .collection("messages").add({
    uid:me.uid,
    username:userData.username||"User",
    rank:userData.rank||"Member",
    text:text,
    createdAt:firebase.firestore.FieldValue.serverTimestamp()
   });
  input.value="";
 }catch(e){alert(e.message)}
}

document.getElementById("message").addEventListener("keydown",e=>{
 if(e.key==="Enter")sendMessage();
});

function listenMessages(){
 if(stopMessages)stopMessages();
 stopMessages=db.collection("rooms").doc("main")
 .collection("messages").orderBy("createdAt","asc").limit(100)
 .onSnapshot(snapshot=>{
  const box=document.getElementById("messages");
  box.innerHTML="";
  snapshot.forEach(doc=>{
   const m=doc.data();
   const div=document.createElement("div");
   div.className="msg";
   const name=document.createElement("strong");
   name.textContent=(m.username||"User")+" ";
   if(m.uid===OWNER)name.textContent+="👑 OWNER";
   const content=document.createElement("div");
   content.textContent=m.text||"";
   div.append(name,content);
   box.appendChild(div);
  });
  box.scrollTop=box.scrollHeight;
 });
}

function listenUsers(){
 if(stopUsers)stopUsers();
 stopUsers=db.collection("users").onSnapshot(snapshot=>{
  const online=document.getElementById("online");
  const offline=document.getElementById("offline");
  online.innerHTML="";
  offline.innerHTML="";
  snapshot.forEach(doc=>{
   const u=doc.data();
   const isOnline=u.lastSeen &&
    Date.now()-u.lastSeen.toMillis()<120000;
   const div=document.createElement("div");
   div.className="member";
   div.textContent=(isOnline?"🟢 ":"⚫ ")+
    (u.username||"User")+" · "+(u.rank||"Member");
   (isOnline?online:offline).appendChild(div);
  });
 });
}

async function showPage(page){
 const title=document.getElementById("pageTitle");
 const messages=document.getElementById("messages");
 document.getElementById("composer").style.display=
  page==="chat"?"flex":"none";
 if(stopPage){stopPage();stopPage=null}
 messages.innerHTML="";

 if(page==="chat"){
  title.innerHTML="<h3>💬 Main Chat</h3>";
  listenMessages();
 }
 if(page==="leaderboard"){
  title.innerHTML="<h3>🏆 Leaderboard</h3>";
  const snap=await db.collection("users").get();
  const users=snap.docs.map(d=>({id:d.id,...d.data()}));
  users.sort((a,b)=>(b.coins||0)-(a.coins||0));
  messages.innerHTML="<h3>🪙 Coin Ranking</h3>";
  users.forEach((u,i)=>{
   const d=document.createElement("div");
   d.className="msg";
   d.textContent=`${i+1}. ${u.username||"User"} — ${Number(u.coins||0).toLocaleString()} coins`;
   messages.appendChild(d);
  });
  const likes=[];
  for(const u of users){
   const l=await db.collection("users").doc(u.id)
    .collection("likes").get();
   likes.push({name:u.username||"User",count:l.size});
  }
  likes.sort((a,b)=>b.count-a.count);
  const h=document.createElement("h3");
  h.textContent="❤️ Profile Likes Ranking";
  messages.appendChild(h);
  likes.forEach((u,i)=>{
   const d=document.createElement("div");
   d.className="msg";
   d.textContent=`${i+1}. ${u.name} — ${u.count} likes`;
   messages.appendChild(d);
  });
 }
 if(page==="news"){
  title.innerHTML="<h3>📢 News</h3>";
  stopPage=db.collection("news").orderBy("createdAt","desc")
   .onSnapshot(s=>{
    messages.innerHTML="";
    s.forEach(doc=>{
     const d=document.createElement("div");
     d.className="msg";
     d.textContent=doc.data().text||"";
     messages.appendChild(d);
    });
   });
 }
 if(page==="wall"){
  title.innerHTML="<h3>👥 Friend Wall</h3>";
  stopPage=db.collection("wallPosts").orderBy("createdAt","desc")
   .onSnapshot(s=>{
    messages.innerHTML="";
    s.forEach(doc=>{
     const d=document.createElement("div");
     d.className="msg";
     d.textContent=doc.data().text||"";
     messages.appendChild(d);
    });
   });
 }
}
</script>
</body>
</html>
