
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TalkTime Pakistan Chat</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9edf2;font-family:Arial,sans-serif;color:#263238}
header{background:#075e54;color:white;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}
header h2{margin:0;font-size:21px}
button{border:0;border-radius:5px;padding:10px 14px;background:#087e70;color:white;font-weight:bold;cursor:pointer}
input,textarea{width:100%;padding:11px;border:1px solid #ccd4dc;border-radius:6px;font-size:15px;margin:5px 0}
#auth{max-width:400px;background:white;padding:22px;margin:45px auto;border-radius:10px}
#app{display:none;max-width:1250px;margin:auto;padding:10px}
.bar{background:#fff;padding:10px;margin-bottom:10px;border-radius:7px;display:flex;gap:7px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:190px minmax(0,1fr) 190px;gap:10px}
.panel{background:white;border-radius:7px;padding:12px;min-width:0}
.room{display:block;width:100%;text-align:left;margin:5px 0;background:#edf3f1;color:#075e54}
.room.active{background:#087e70;color:white}
#messages{height:65vh;min-height:300px;overflow-y:auto;background:#f6f8fa;padding:10px;border:1px solid #e5e9ed;border-radius:6px}
.msg{background:white;border:1px solid #e2e7eb;border-radius:7px;padding:9px;margin:7px 0;overflow-wrap:anywhere}
.msg b{color:#087e70}
.msg small{float:right;color:#89949e}
.send{display:flex;gap:6px;margin-top:8px}
.send input{margin:0}
.member{padding:8px;border-bottom:1px solid #eee}
.muted{font-size:12px;color:#78838f}
@media(max-width:700px){
.layout{grid-template-columns:1fr}
#messages{height:55vh}
}
</style>
</head>
<body>

<header>
<h2>🇵🇰 TalkTime</h2>
<button id="logout" style="display:none" onclick="auth.signOut()">Logout</button>
</header>

<div id="auth">
<h2>Welcome to TalkTime</h2>
<p class="muted">Join our Pakistani community chat</p>
<input id="username" placeholder="Username (signup)" maxlength="20">
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button style="width:100%" onclick="signup()">Create Account</button>
<button style="width:100%;margin-top:7px;background:#2457d6" onclick="login()">Login</button>
<p id="status" class="muted"></p>
</div>

<div id="app">
<div class="bar">
<button onclick="openRoom('main')">Main Chat</button>
<button onclick="openRoom('lahore')">Lahore</button>
<button onclick="openRoom('karachi')">Karachi</button>
<button onclick="openRoom('islamabad')">Islamabad</button>
<button onclick="openRoom('multan')">Multan</button>
<button onclick="openRoom('peshawar')">Peshawar</button>
<button onclick="openRoom('quetta')">Quetta</button>
</div>

<div class="layout">
<aside class="panel">
<h3>Chat Rooms</h3>
<div id="roomButtons"></div>
<hr>
<h3>My Profile</h3>
<div id="myName"></div>
<textarea id="bio" rows="3" maxlength="160" placeholder="About me"></textarea>
<button onclick="saveBio()">Save Bio</button>
</aside>

<main class="panel">
<h3 id="roomTitle">Main Lobby</h3>
<div id="messages">Loading chat...</div>
<div style="margin-top:8px">
<button onclick="addEmoji('😊')">😊</button>
<button onclick="addEmoji('❤️')">❤️</button>
<button onclick="addEmoji('😂')">😂</button>
<button onclick="addEmoji('😍')">😍</button>
<button onclick="addEmoji('🔥')">🔥</button>
<button onclick="addEmoji('👍')">👍</button>
</div>
<div class="send">
<input id="message" maxlength="1000" placeholder="Type your message..." onkeydown="if(event.key==='Enter')sendMessage()">
<button onclick="sendMessage()">Send</button>
</div>
<p class="muted">Respect everyone. Do not share personal information.</p>
</main>

<aside class="panel">
<h3>Members</h3>
<div id="members">Loading...</div>
</aside>
</div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyDNrlP_auYAjDU6C43THL3cOvVqmQR1kYM",
authDomain:"talktime-70e88.firebaseapp.com",
projectId:"talktime-70e88",
storageBucket:"talktime-70e88.firebasestorage.app",
messagingSenderId:"356630061165",
appId:"1:356630061165:web:156f9afef56c58d1881f64",
measurementId:"G-VS2EHB4KM7"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

let me=null;
let myName="";
let currentRoom="main";
let stopChat=null;
let stopMembers=null;

const rooms={
main:"Main Lobby",
lahore:"Lahore",
karachi:"Karachi",
islamabad:"Islamabad",
multan:"Multan",
peshawar:"Peshawar",
quetta:"Quetta"
};

document.getElementById("roomButtons").innerHTML=
Object.entries(rooms).map(([id,name])=>
`<button class="room" id="room-${id}" onclick="openRoom('${id}')">${name}</button>`
).join("");

function say(message){
document.getElementById("status").textContent=message;
}

async function signup(){
const name=document.getElementById("username").value.trim();
const email=document.getElementById("email").value.trim();
const pass=document.getElementById("password").value;
if(name.length<3||name.length>20)return say("Username 3-20 characters hona chahiye.");
if(!email||pass.length<6)return say("Email aur 6 character password enter karein.");
try{
const result=await auth.createUserWithEmailAndPassword(email,pass);
await db.collection("users").doc(result.user.uid).set({
username:name,bio:"",
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
}catch(e){say(e.message)}
}

async function login(){
try{
await auth.signInWithEmailAndPassword(
document.getElementById("email").value.trim(),
document.getElementById("password").value
);
}catch(e){say(e.message)}
}

auth.onAuthStateChanged(async user=>{
if(stopChat)stopChat();
if(stopMembers)stopMembers();

if(!user){
me=null;
document.getElementById("auth").style.display="block";
document.getElementById("app").style.display="none";
document.getElementById("logout").style.display="none";
return;
}

me=user;
try{
const profile=await db.collection("users").doc(user.uid).get();
if(!profile.exists){
alert("Profile nahi mila.");
await auth.signOut();
return;
}
myName=profile.data().username;
document.getElementById("myName").textContent=myName;
document.getElementById("bio").value=profile.data().bio||"";
document.getElementById("auth").style.display="none";
document.getElementById("app").style.display="block";
document.getElementById("logout").style.display="block";
openRoom("main");
loadMembers();
}catch(e){alert(e.message)}
});

function openRoom(id){
currentRoom=id;
document.getElementById("roomTitle").textContent=rooms[id];
Object.keys(rooms).forEach(r=>{
document.getElementById("room-"+r).classList.toggle("active",r===id);
});
if(stopChat)stopChat();

const box=document.getElementById("messages");
box.textContent="Loading messages...";

stopChat=db.collection("rooms").doc(id).collection("messages")
.orderBy("createdAt","asc").limit(100)
.onSnapshot(snapshot=>{
box.innerHTML="";
snapshot.forEach(doc=>{
const data=doc.data();
const div=document.createElement("div");
div.className="msg";
const name=document.createElement("b");
name.textContent=data.username||"Member";
const time=document.createElement("small");
time.textContent=data.createdAt?.toDate?
data.createdAt.toDate().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
const text=document.createElement("div");
text.textContent=data.text||"";
div.append(name,time,text);
box.appendChild(div);
});
box.scrollTop=box.scrollHeight;
},error=>box.textContent="Chat error: "+error.message);
}

async function sendMessage(){
const input=document.getElementById("message");
const text=input.value.trim();
if(!text||!me)return;
if(/https?:\/\/|www\./i.test(text)){
alert("Public chat mein links allowed nahi hain.");
return;
}
input.value="";
try{
await db.collection("rooms").doc(currentRoom).collection("messages").add({
uid:me.uid,
username:myName,
text:text,
createdAt:firebase.firestore.FieldValue.serverTimestamp()
});
}catch(e){
input.value=text;
alert("Message send error: "+e.message);
}
}

function addEmoji(e){
const input=document.getElementById("message");
input.value+=e;
input.focus();
}

async function saveBio(){
try{
await db.collection("users").doc(me.uid).update({
bio:document.getElementById("bio").value.trim()
});
alert("Bio saved!");
}catch(e){alert(e.message)}
}

function loadMembers(){
stopMembers=db.collection("users").orderBy("createdAt","asc").limit(100)
.onSnapshot(snapshot=>{
const box=document.getElementById("members");
box.innerHTML="";
snapshot.forEach(doc=>{
const data=doc.data();
const div=document.createElement("div");
div.className="member";
const name=document.createElement("b");
name.textContent="👤 "+(data.username||"Member");
const bio=document.createElement("div");
bio.className="muted";
bio.textContent=data.bio||"TalkTime member";
div.append(name,bio);
box.appendChild(div);
});
},error=>{
document.getElementById("members").textContent=error.message;
});
}
</script>
</body>
</html>
